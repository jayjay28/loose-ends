<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifeline — Project Console</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --stage:#E9E2D5;--paper:#F7F3EC;--card:#FEFCF7;--chip:#EFE9DD;
    --ink:#23201B;--ink-soft:#5E574C;--ink-faint:#9A9082;--ink-ghost:#C1B7A6;
    --rule:rgba(35,32,27,.12);--rule-soft:rgba(35,32,27,.06);
    --brand:#2F7269;--brand-soft:rgba(47,114,105,.14);
    --ember:#B95435;--ember-soft:rgba(185,84,53,.14);--good:#5B7F32;--good-soft:rgba(91,127,50,.16);
    --serif:ui-serif,"New York",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    --shadow:0 1px 2px rgba(35,32,27,.05),0 8px 26px rgba(35,32,27,.07);
  }
  @media (prefers-color-scheme:dark){:root{
    --stage:#0C0B09;--paper:#16140F;--card:#1E1B16;--chip:#2A261F;
    --ink:#ECE7DD;--ink-soft:#A69C8C;--ink-faint:#7D7568;--ink-ghost:#4C463B;
    --rule:rgba(255,252,244,.14);--rule-soft:rgba(255,252,244,.06);
    --brand:#5FA99B;--brand-soft:rgba(95,169,155,.18);--ember:#E07A52;--ember-soft:rgba(224,122,82,.18);--good:#8FB35E;--good-soft:rgba(143,179,94,.18);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.5);
  }}
  *{box-sizing:border-box}body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--sans)}
  .wrap{max-width:820px;margin:0 auto;padding:34px 18px 70px}
  .eyebrow{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
  h1{font:600 30px/1.1 var(--serif);letter-spacing:-.01em;margin:9px 0 18px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);margin-bottom:20px;flex-wrap:wrap}
  .tab{font:600 13px/1 var(--sans);color:var(--ink-soft);background:transparent;border:0;padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--ink);border-bottom-color:var(--brand)}
  .panel{display:none}.panel.on{display:block}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .statgrid{display:flex;gap:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 14px}
  .stat .k{font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .stat .v{font:600 22px/1.1 var(--serif);margin-top:7px}
  .pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);padding:5px 9px;border-radius:999px}
  .pill.on{background:var(--good-soft);color:var(--good)}.pill.off{background:var(--chip);color:var(--ink-faint)}
  .btn{font:600 13px/1 var(--sans);padding:10px 15px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
  .btn.brand{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.danger{color:var(--ember);border-color:var(--ember-soft)}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .doc{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:6px 22px 18px;box-shadow:var(--shadow)}
  .doc h1{font:600 24px/1.2 var(--serif);margin:22px 0 8px;border:0}
  .doc h2{font:600 17px/1.2 var(--sans);margin:22px 0 8px}
  .doc h3{font:600 14px/1.2 var(--sans);letter-spacing:.02em;margin:16px 0 6px}
  .doc p,.doc li{font:400 15px/1.65 var(--sans);color:var(--ink)}
  .doc code{font:500 13px/1 ui-monospace,Menlo,monospace;background:var(--chip);padding:2px 6px;border-radius:5px}
  .doc blockquote{border-left:3px solid var(--rule);margin:12px 0;padding:2px 0 2px 14px;color:var(--ink-soft)}
  .doc table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
  .doc th,.doc td{border:1px solid var(--rule);padding:7px 10px;text-align:left}
  .doc a{color:var(--brand)}
  .links{display:flex;flex-direction:column;gap:9px}
  .link{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--card);border:1px solid var(--rule);border-radius:12px;text-decoration:none;color:var(--ink)}
  .link:hover{border-color:var(--brand)}
  .link .t{font:600 15px/1.2 var(--sans)}.link .d{font:400 12.5px/1.3 var(--sans);color:var(--ink-faint);margin-top:2px}
  .link .arw{margin-left:auto;color:var(--ink-ghost)}
  .muted{font:400 12.5px/1.5 var(--sans);color:var(--ink-faint);margin-top:8px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);font:600 13px/1 var(--sans);padding:11px 18px;border-radius:999px;opacity:0;transition:.25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style></head>
<body><div class="wrap">
  <div class="eyebrow">Lifeline · Project Console</div>
  <h1>Manage the project</h1>

  <div class="tabs">
    <button class="tab on" data-p="status">Status</button>
    <button class="tab" data-p="vision">Vision</button>
    <button class="tab" data-p="plan">Plan</button>
    <button class="tab" data-p="links">Docs &amp; mockups</button>
    <button class="tab" data-p="feedback">Feedback</button>
  </div>

  <section class="panel on" id="status">
    <div class="statgrid">
      <div class="stat"><div class="k">Open items</div><div class="v" id="s-items">—</div></div>
      <div class="stat"><div class="k">Extraction</div><div class="v" style="font-size:16px" id="s-model">—</div></div>
      <div class="stat"><div class="k">Version</div><div class="v" id="s-ver">—</div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div id="s-pills" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <div class="btnrow">
        <button class="btn brand" id="b-poll">Run a poll now</button>
        <button class="btn" id="b-refresh">Refresh status</button>
        <button class="btn danger" id="b-purge">Purge &amp; re-sync</button>
      </div>
      <div class="muted" id="s-msg"></div>
    </div>
  </section>

  <section class="panel" id="vision"><div class="doc" id="d-vision">Loading…</div></section>
  <section class="panel" id="plan"><div class="doc" id="d-plan">Loading…</div></section>


  <section class="panel" id="feedback">
    <div class="card">
      <div class="row" style="display:flex;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:120px"><label style="font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)">Area</label>
          <select id="f-area" style="width:100%"><option>Today</option><option>Threads</option><option>Decision thread</option><option>Names / Contacts</option><option>Titles / Actions</option><option>Notifications</option><option>Performance / Crash</option><option>Design / Type</option><option>Other</option></select></div>
        <div style="flex:1;min-width:110px"><label style="font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)">Type</label>
          <select id="f-type" style="width:100%"><option>Bug</option><option>Idea</option><option>Polish</option><option>Praise</option></select></div>
        <div style="flex:1;min-width:110px"><label style="font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)">Priority</label>
          <select id="f-pri" style="width:100%"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select></div>
      </div>
      <div style="margin-top:10px"><textarea id="f-note" placeholder="What worked, what didn't…" style="width:100%;min-height:64px;resize:vertical;font:400 15px/1.4 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 11px"></textarea></div>
      <div class="btnrow"><button class="btn brand" id="f-add">Add note</button><button class="btn" id="f-copy">Copy all as markdown</button></div>
      <div class="muted" id="f-msg">Saved to <code>docs/feedback.json</code> in the repo — permanent.</div>
    </div>
    <div id="f-list"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
  const VISION = __VISION_JSON__;
  const PLAN = __PLAN_JSON__;
  const $=s=>document.querySelector(s);
  function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900)}

  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");$("#"+t.dataset.p).classList.add("on");
  });

  if(window.marked){
    $("#d-vision").innerHTML=marked.parse(VISION||"_VISION.md not found._");
    $("#d-plan").innerHTML=marked.parse(PLAN||"_PLAN.md not found._");
  }

  async function loadStatus(){
    try{
      const h=await (await fetch("/health")).json();
      $("#s-items").textContent=h.open_items;
      $("#s-ver").textContent="v"+h.version;
      $("#s-model").textContent=h.claude_configured?"Claude":h.gemini_configured?"Gemini":"Heuristic";
      const p=[["Gemini",h.gemini_configured],["Claude",h.claude_configured],["Google",h.google_connected],["Push",h.apns_configured]];
      $("#s-pills").innerHTML=p.map(([n,on])=>`<span class="pill ${on?'on':'off'}">${on?'●':'○'} ${n}</span>`).join("");
    }catch(e){$("#s-msg").textContent="Backend not reachable."}
  }
  $("#b-refresh").onclick=loadStatus;
  $("#b-poll").onclick=async()=>{toast("Polling…");await fetch("/sync/poll",{method:"POST"});setTimeout(loadStatus,1500);toast("Poll started")};
  $("#b-purge").onclick=async()=>{if(!confirm("Purge all data and re-sync from scratch?"))return;toast("Purging…");await fetch("/admin/purge",{method:"POST"});await fetch("/sync/poll",{method:"POST"});setTimeout(loadStatus,1500);toast("Re-syncing")};
  loadStatus();

  function esc(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
  async function loadFeedback(){
    let items=[];try{items=await (await fetch("/feedback")).json()}catch(e){}
    const el=$("#f-list");
    if(!items.length){el.innerHTML='<div class="muted" style="padding:14px 2px">No notes yet.</div>';return}
    const pc={high:"var(--ember)",med:"#B07A1E",low:"var(--ink-ghost)"};
    el.innerHTML=items.map(e=>`<div class="card" style="display:flex;gap:12px;align-items:flex-start">
      <span style="width:6px;align-self:stretch;border-radius:3px;flex:none;background:${pc[e.priority]||'var(--ink-ghost)'}"></span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:5px">
          <span class="pill off">${esc(e.area)}</span><span class="pill off">${esc(e.type)}</span>
          <span class="pill off">${e.priority==='high'?'High':e.priority==='low'?'Low':'Medium'}</span>
        </div>
        <div style="font:400 15px/1.55 var(--sans);color:var(--ink);white-space:pre-wrap;word-break:break-word">${esc(e.note)}</div>
      </div>
      <button data-id="${e.id}" aria-label="Delete" style="background:transparent;border:0;color:var(--ink-ghost);font-size:18px;cursor:pointer;padding:2px 6px;flex:none">×</button>
    </div>`).join("");
    el.querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{await fetch("/feedback/"+b.dataset.id,{method:"DELETE"});loadFeedback();toast("Deleted")});
  }
  $("#f-add").onclick=async()=>{
    const note=$("#f-note").value.trim();
    if(!note){$("#f-note").focus();return}
    const body={area:$("#f-area").value,type:$("#f-type").value,priority:$("#f-pri").value,note};
    await fetch("/feedback",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    $("#f-note").value="";loadFeedback();toast("Saved");
  };
  $("#f-note").addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter")$("#f-add").click()});
  $("#f-copy").onclick=async()=>{
    const items=await (await fetch("/feedback")).json();
    if(!items.length){toast("Nothing to copy");return}
    const md="# Lifeline feedback\n\n"+items.map(e=>`- **[${(e.priority||'').toUpperCase()}] ${e.area} · ${e.type}** — ${e.note}`).join("\n");
    navigator.clipboard.writeText(md).then(()=>toast("Copied"),()=>toast("Copy failed"));
  };
  loadFeedback();
</script>
</body></html>
