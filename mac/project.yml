name: Loose Ends Menu Bar
options:
  bundleIdPrefix: dev.clyon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: E4AMNFD4MA
    # The engine talks over loopback, which is cleartext by design — the
    # gate trusts a genuinely local socket and nothing else.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LooseEndsMenuBar:
    type: application
    platform: macOS
    sources:
      - path: LooseEndsMenuBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clyon.looseends.menubar
        PRODUCT_NAME: Loose Ends
        INFOPLIST_FILE: LooseEndsMenuBar/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # It runs launchctl and talks to loopback; the sandbox would forbid
        # both, and this is a local operator's tool, not a store app.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  Loose Ends Menu Bar:
    build:
      targets:
        LooseEndsMenuBar: all
    run:
      config: Debug
